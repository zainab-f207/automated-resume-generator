<!DOCTYPE html>
<html>
<head>
    <style>
        :root {
            --accent: #222222;
            --font: Arial, Helvetica, sans-serif;
        }

        body {
            font-family: var(--font);
            font-size: 11pt;
            color: #111;
            max-width: 800px;
            margin: 30px auto;
            line-height: 1.5;
        }

        h1 {
            font-size: 22pt;
            margin: 0;
            color: #000;
        }

        .job-title {
            font-size: 12pt;
            color: var(--accent);
            margin: 2px 0 8px;
            font-weight: 600;
        }

        .contact {
            font-size: 9.5pt;
            color: #444;
            margin-bottom: 18px;
        }

        h2 {
            font-size: 12pt;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--accent);
            padding-bottom: 4px;
            margin: 18px 0 8px;
        }

        p {
            margin: 4px 0 8px;
        }

        ul {
            margin: 4px 0 8px 20px;
            padding: 0;
        }

        .job-block,
        .edu-block {
            margin-bottom: 12px;
        }

            .job-block strong,
            .edu-block strong {
                font-size: 11pt;
            }
    </style>
</head>

<body>

    <h1>{{FirstName}} {{LastName}}</h1>
    <div class="job-title">{{JobTitle}}</div>
    <div class="contact">{{Email}} | {{Phone}} | {{Address}} | {{Website}}</div>

    <h2>Professional Summary</h2>
    <p>{{AboutMe}}</p>

    <h2>Core Skills</h2>
    <ul>{{SkillsList}}</ul>

    <h2>Professional Experience</h2>
    <div>{{WorkExperienceSection}}</div>

    <h2>Education</h2>
    <div>{{EducationSection}}</div>

    {{OptionalSections}}

    <h2>References</h2>
    <div>{{ReferencesSection}}</div>

</body>
</html>
