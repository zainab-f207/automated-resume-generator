<!DOCTYPE html>
<html>
<head>
    <style>
        :root {
            --accent: #7c3aed;
            --font: 'Segoe UI', Arial, sans-serif;
        }

        body {
            font-family: var(--font);
            font-size: 10.8pt;
            color: #1f2937;
            max-width: 800px;
            margin: 28px auto;
            line-height: 1.47;
        }

        h1 {
            font-size: 24pt;
            margin: 0;
            font-weight: 700;
        }

        .job-title {
            font-size: 12pt;
            color: var(--accent);
            font-weight: 600;
            margin-top: 2px;
        }

        .contact {
            font-size: 9.2pt;
            color: #4b5563;
            margin: 7px 0 17px;
        }

        h2 {
            font-size: 11.5pt;
            text-transform: uppercase;
            letter-spacing: .8px;
            color: var(--accent);
            margin: 18px 0 7px;
        }

            h2::after {
                content: "";
                display: block;
                border-bottom: 2px solid var(--accent);
                width: 45px;
                margin-top: 4px;
            }

        p {
            margin: 4px 0 8px;
        }

        ul {
            margin: 4px 0 8px 20px;
            padding: 0;
        }

        li {
            margin-bottom: 3px;
        }

        .job-block,
        .edu-block {
            margin-bottom: 11px;
        }
    </style>
</head>

<body>

    <h1>{{FirstName}} {{LastName}}</h1>
    <div class="job-title">{{JobTitle}}</div>
    <div class="contact">{{Email}} | {{Phone}} | {{Address}} | {{Website}}</div>

    <h2>About</h2>
    <p>{{AboutMe}}</p>

    <h2>Capabilities</h2>
    <ul>{{SkillsList}}</ul>

    <h2>Experience</h2>
    <div>{{WorkExperienceSection}}</div>
    <div>{{ProjectsSection}}</div>

    <h2>Education</h2>
    <div>{{EducationSection}}</div>

    {{OptionalSections}}
    {{ReferencesSection}}

</body>
</html>
