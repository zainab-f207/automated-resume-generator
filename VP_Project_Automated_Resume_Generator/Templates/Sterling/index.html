<!DOCTYPE html>
<html>
<head>
    <style>
        :root {
            --accent: #66524a;
            --font: Garamond, Georgia, serif;
        }

        body {
            font-family: var(--font);
            font-size: 11.2pt;
            color: #292929;
            max-width: 790px;
            margin: 32px auto;
            line-height: 1.52;
        }

        h1 {
            font-size: 26pt;
            margin: 0;
            letter-spacing: .3px;
        }

        .job-title {
            font-size: 12pt;
            color: var(--accent);
            margin: 3px 0;
        }

        .contact {
            font-family: Arial, sans-serif;
            font-size: 9pt;
            color: #555;
            margin-bottom: 20px;
        }

        h2 {
            font-size: 12pt;
            font-weight: bold;
            letter-spacing: 1px;
            color: var(--accent);
            margin: 20px 0 8px;
            border-bottom: 1px solid #aaa;
            padding-bottom: 3px;
        }

        p {
            margin: 4px 0 9px;
        }

        ul {
            margin: 4px 0 8px 21px;
        }

        .job-block,
        .edu-block {
            margin-bottom: 13px;
        }
    </style>
</head>

<body>

    <h1>{{FirstName}} {{LastName}}</h1>
    <div class="job-title">{{JobTitle}}</div>
    <div class="contact">{{Email}} | {{Phone}} | {{Address}} | {{Website}}</div>

    <h2>Profile</h2>
    <p>{{AboutMe}}</p>

    <h2>Expertise</h2>
    <ul>{{SkillsList}}</ul>

    <h2>Professional Experience</h2>
    <div>{{WorkExperienceSection}}</div>

    <h2>Education</h2>
    <div>{{EducationSection}}</div>

    {{OptionalSections}}

    <h2>References</h2>
    <div>{{ReferencesSection}}</div>

</body>
</html>
