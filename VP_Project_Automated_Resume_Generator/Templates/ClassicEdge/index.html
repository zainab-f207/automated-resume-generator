<!DOCTYPE html>
<html>
<head>
    <style>
        :root {
            --accent: #243447;
            --font: Cambria, Georgia, serif;
        }

        body {
            font-family: var(--font);
            font-size: 11pt;
            color: #202020;
            max-width: 800px;
            margin: 30px auto;
            line-height: 1.48;
        }

        h1 {
            font-size: 23pt;
            margin: 0;
        }

        .job-title {
            font-size: 12pt;
            color: var(--accent);
            font-weight: bold;
            margin: 2px 0 7px;
        }

        .contact {
            font-family: Arial, sans-serif;
            font-size: 9pt;
            color: #555;
            margin-bottom: 15px;
        }

        h2 {
            font-family: Arial, sans-serif;
            font-size: 11.5pt;
            text-transform: uppercase;
            color: var(--accent);
            border-left: 4px solid var(--accent);
            padding-left: 8px;
            margin: 18px 0 8px;
        }

        p {
            margin: 4px 0 8px;
        }

        ul {
            margin: 4px 0 8px 20px;
            padding: 0;
        }

        .job-block,
        .edu-block {
            margin-bottom: 11px;
        }
    </style>
</head>

<body>

    <h1>{{FirstName}} {{LastName}}</h1>
    <div class="job-title">{{JobTitle}}</div>
    <div class="contact">{{Email}} | {{Phone}} | {{Address}} | {{Website}}</div>

    <h2>Professional Profile</h2>
    <p>{{AboutMe}}</p>

    <h2>Skills</h2>
    <ul>{{SkillsList}}</ul>

    <h2>Work History</h2>
    <div>{{WorkExperienceSection}}</div>
    <div>{{ProjectsSection}}</div>

    <h2>Education</h2>
    <div>{{EducationSection}}</div>

    {{OptionalSections}}
    {{ReferencesSection}}

</body>
</html>
