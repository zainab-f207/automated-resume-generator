<!DOCTYPE html>
<html>
<head>
    <style>
        /* ===== VARIANT KNOBS — only change these 2 lines per template ===== */
        :root {
            --font: Helvetica, Arial, sans-serif;
            --accent: #555555;
        }
        /* ==================================================================== */
        body {
            font-family: var(--font);
            font-size: 11pt;
            color: #111;
            max-width: 800px;
            margin: 30px auto;
            line-height: 1.5;
        }

        h1 {
            font-size: 20pt;
            margin-bottom: 2px;
            color: #000;
        }

        .job-title {
            font-size: 12pt;
            color: var(--accent);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .contact {
            font-size: 10pt;
            color: #333;
            margin-bottom: 16px;
        }

        h2 {
            font-size: 12.5pt;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1.5px solid var(--accent);
            padding-bottom: 3px;
            margin-top: 20px;
            margin-bottom: 8px;
            color: #000;
        }

        ul {
            margin: 4px 0 4px 20px;
            padding: 0;
        }

        .job-block, .edu-block {
            margin-bottom: 10px;
        }

            .job-block strong, .edu-block strong {
                font-size: 11pt;
            }
    </style>
</head>
<body>
    <h1>{{FirstName}} {{LastName}}</h1>
    <div class="job-title">{{JobTitle}}</div>
    <div class="contact">{{Email}} &nbsp;|&nbsp; {{Phone}} &nbsp;|&nbsp; {{Address}} &nbsp;|&nbsp; {{Website}}</div>

    <h2>Summary</h2>
    <p>{{AboutMe}}</p>

    <h2>Skills</h2>
    <ul>{{SkillsList}}</ul>

    <h2>Work Experience</h2>
    <div>{{WorkExperienceSection}}</div>
    <div>{{ProjectsSection}}</div>

    <h2>Education</h2>
    <div>{{EducationSection}}</div>

    {{OptionalSections}}
    {{ReferencesSection}}
</body>
</html>
