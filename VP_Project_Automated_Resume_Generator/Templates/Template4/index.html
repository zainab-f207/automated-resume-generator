<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{FirstName}} {{LastName}} - Resume</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @page {
            size: A4;
            margin: 1in;
        }

        @font-face {
            font-family: 'Roboto';
            src: url('Fonts/Roboto_SemiCondensed-Light.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Roboto', sans-serif;
        }

        body {
            width: 100%;
            max-width: 800px;
            margin: auto;
            color: #333;
            background-color: #f5f5f5;
            line-height: 1.5;
        }

        .resume-container {
            width: 100%;
            max-width: 800px;
            background-color: white;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            padding: 40px;
        }

        .name-header {
            text-align: center;
            margin-bottom: 30px;
        }

            .name-header h1 {
                font-size: 28px;
                font-weight: 700;
                text-transform: uppercase;
                color: #6c5ce7;
                margin-bottom: 10px;
                letter-spacing: 1px;
            }

        .job-title {
            font-size: 18px;
            color: #666;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .about-section {
            font-style: italic;
            color: #000;
            margin-bottom: 30px;
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .contact-info {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

            .contact-info div {
                color: #000;
                font-size: 14px;
                display: flex;
                align-items: center;
            }

            .contact-info i {
                width: 20px;
                margin-right: 8px;
                color: #6c5ce7;
                text-align: center;
                font-size: 14px;
            }

        .section {
            margin-bottom: 30px;
        }

        h2 {
            font-size: 18px;
            font-weight: 600;
            text-transform: uppercase;
            color: #6c5ce7;
            margin-bottom: 15px;
            padding-bottom: 5px;
            border-bottom: 2px solid #6c5ce7;
        }

            .section-title i {
                margin-right: 10px;
            }

        .experience-item, .education-item {
            margin-bottom: 25px;
            color: #000;
        }

       
        .skills-list{
            list-style-type: none;
            color: #000;
        }

            .skills-list li{
                margin-bottom: 8px;
                position: relative;
                padding-left: 25px;
            }

                .skills-list li:before {
                    content: "•";
                    position: absolute;
                    left: 0;
                    color: #6c5ce7;
                    font-weight: bold;
                }

        @media (max-width: 768px) {
            .contact-info {
                flex-direction: column;
                align-items: center;
                gap: 10px;
            }

            .resume-container {
                padding: 20px;
            }
        }
        @media print{
            body {
                margin: 0;
                padding: 0;
                background-color: white;
            }

            .resume-container {
                box-shadow: none;
                width: 100%;
                max-width: none;
                padding: 20px;
            }

            .name-header h1, .job-title, .about-section p, .contact-info div, h2, .skills-list li {
                color: black;
            }

            .contact-info i {
                color: black;
            }
        }
    </style>
</head>
<body>
    <div class="resume-container">
        <!-- Name Header -->
        <div class="name-header">
            <h1>{{FirstName}} {{LastName}}</h1>
            <div class="job-title">{{JobTitle}}</div>
        </div>


        <!-- Contact Info -->
        <div class="contact-info">
            <div>{{Email}}</div>
            <div>{{Phone}}</div>
            <div>{{Website}}</div>
            <div>{{Address}}</div>
        </div>


        <div class="about-section">
            <h2>About Me</h2>
            <p>{{AboutMe}}</p>
        </div>

        <!-- Skills -->
        <div class="section">
            <h2>Technical Skills</h2>
            <ul class="skills-list">
                {{SkillsList}}
            </ul>
        </div>

        <!-- Education -->
        <div class="section">
            <h2>Education</h2>

            <div class="education-item">
                {{EducationSection}}
            </div>
        </div>

        <!-- Professional Experience -->
        <div class="section">
            <h2>Professional Experience</h2>

            <div class="experience-item">
                {{WorkExperienceSection}}
            </div>
        </div>



        <div class="section">
            <h2>References</h2>
            <div class="reference">
                {{ReferencesSection}}
            </div>
        </div>
    </div>
</body>
</html>
